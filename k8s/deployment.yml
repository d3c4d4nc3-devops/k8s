apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app-deployment
  labels:
    app: my-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
      - name: my-app-container
        image: d3c4d4nc3/fastapi_demo:e4db1916a6e24510e29dabb3a5b7fddb40f2ee3e
        ports:
        - containerPort: 8000

